[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-webcam"
version = "0.1.0"
description = "A desktop webcam preview and local visual chat with Gemma and Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PySide6-Essentials==6.12.0",
  "PySide6-Addons==6.12.0",
  "opencv-contrib-python-headless>=4.12,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.17,<7"]

[project.gui-scripts]
agent-webcam = "agent_webcam.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_webcam"]
